<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Customer Account</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<script>

if(localStorage.getItem("loggedIn")!="true"){

window.location.href="index.html";

}

</script>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

<div class="logo-section">

<img src="logo.png" class="sidebar-logo">

<h2>SMART BANK</h2>

</div>

<a href="dashboard.html">Dashboard</a>

<a href="create-account.html">Create Account</a>

<a href="accounts.html">Customer Records</a>

<a href="manage-account.html">Manage Account</a>

<a href="transaction.html">Transactions</a>

<a href="transaction-history.html">Transaction History</a>

<a href="profile.html">Customer Profile</a>

<a href="reports.html">Reports</a>

<a href="settings.html">Settings</a>

</div>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-content">

<h1>Manage Customer Account</h1>

<div class="form-container">

<!-- ROW 1 -->

<div class="form-row">

<div class="input-group">

<label>Account Number</label>

<input type="number"
id="accountNo"
value="123456789">

</div>

<div class="input-group">

<label>Customer Name</label>

<input type="text"
id="customerName"
value="Subasri">

</div>

</div>

<!-- ROW 2 -->

<div class="form-row">

<div class="input-group">

<label>Phone Number</label>

<input type="text"
value="9876543210">

</div>

<div class="input-group">

<label>Email Address</label>

<input type="email"
value="subasri@gmail.com">

</div>

</div>

<!-- ROW 3 -->

<div class="form-row">

<div class="input-group">

<label>Date of Birth</label>

<input type="date"
value="2004-05-10">

</div>

<div class="input-group">

<label>Gender</label>

<select>

<option>Female</option>

<option>Male</option>

<option>Other</option>

</select>

</div>

</div>

<!-- ROW 4 -->

<div class="form-row">

<div class="input-group">

<label>Branch Name</label>

<input type="text"
value="Chennai Main Branch">

</div>

<div class="input-group">

<label>IFSC Code</label>

<input type="text"
value="SBIN0001234">

</div>

</div>

<!-- ROW 5 -->

<div class="form-row">

<div class="input-group">

<label>PAN Number</label>

<input type="text"
value="ABCDE1234F">

</div>

<div class="input-group">

<label>Aadhaar Number</label>

<input type="text"
value="XXXX XXXX 4567">

</div>

</div>

<!-- ROW 6 -->

<div class="input-group">

<label>Customer Address</label>

<textarea rows="4">

Chennai, Tamil Nadu

</textarea>

</div>

<!-- ROW 7 -->

<div class="form-row">

<div class="input-group">

<label>Account Balance</label>

<input type="number"
id="balance"
value="5000">

</div>

<div class="input-group">

<label>Account Status</label>

<select>

<option>Active</option>

<option>Frozen</option>

<option>Closed</option>

</select>

</div>

</div>

<!-- BUTTONS -->

<div class="button-group">

<button onclick="updateAccount()">

Update Account

</button>

<button class="delete-btn"
onclick="deleteAccount()">

Delete Account

</button>

</div>

</div>

</div>

<!-- ================= SCRIPT ================= -->

<script>

function updateAccount(){

alert("Customer Account Updated Successfully");

}

function deleteAccount(){

let confirmDelete=
confirm("Are you sure you want to delete this account?");

if(confirmDelete){

alert("Customer Account Deleted");

}

}

</script>

</body>

</html>
